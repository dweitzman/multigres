<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Consensus Viewer</title>

    <style>
      body {
        font-family: sans-serif;
      }

      #controls {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      #controls button {
        width: 32px;
        height: 28px;
        font-size: 14px;
        line-height: 1;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }

      .log-entry {
        fill: white;
        stroke: black;
      }

      .log-entry.committed {
        fill: #9be79b;
      }

      .log-entry.diverged {
        fill: #ffb3b3;
      }

      /* Term rule-change entries — distinct from user data transactions */
      .log-entry.rule {
        fill: #ddd8ff;
        stroke: #7766cc;
      }

      .log-entry.rule.committed {
        fill: #bcb0ff;
      }

      .message {
        stroke: red;
        stroke-width: 2;
        fill: none;
      }

      .message.dropped {
        stroke: #bbb;
        stroke-dasharray: 5, 5;
      }
    </style>
  </head>

  <body>
    <div id="controls">
      <select id="exampleSelect" onchange="loadExample(this.value)"></select>

      <button id="btnReset" onclick="resetTick()">↺</button>
      <button id="btnPrev" onclick="prevTick()">⏮</button>
      <button id="btnPlay" onclick="togglePlay()">▶</button>
      <button id="btnNext" onclick="nextTick()">⏭</button>

      Tick: <span id="tickLabel"></span>
    </div>

    <svg id="canvas" width="1100" height="700"></svg>

    <div
      id="legend"
      style="
        margin-top: 16px;
        font-size: 13px;
        font-family: monospace;
        max-width: 900px;
      "
    ></div>

    <script src="examples/shard_initialization.js"></script>
    <script src="examples/phantom_transaction_recovery.js"></script>
    <script src="viewer.js"></script>
  </body>
</html>
