# PostgreSQL Client Authentication Configuration File
# ===================================================
#
# Generated by Multigres - Helping you Scale PostgreSQL
#
# This file controls: which hosts are allowed to connect, how clients
# are authenticated, which PostgreSQL user names they can use, which
# databases they can access. Records take one of these forms:
#
# local      DATABASE  USER  METHOD  [OPTIONS]
# host       DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostssl    DATABASE  USER  ADDRESS  METHOD  [OPTIONS]
# hostnossl  DATABASE  USER  ADDRESS  METHOD  [OPTIONS]

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
# multigres_admin: trust for local services (multipooler, pgbackrest, etc.)
# Security relies on network isolation - only localhost can use trust auth.
local   all             {{.User}}                               trust
# postgres user: trust for local tools (psql, pgbench, etc.)
# TODO: Consider using peer map like Supabase (peer map=multigres_map) with pg_ident.conf
# to map specific OS users to postgres, rather than blanket trust.
local   all             postgres                                trust
# Other users: peer authentication (OS user must match DB user)
local   all             all                                     peer

# Replication connections (localhost only for now)
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Localhost TCP connections: trust for internal services (e.g., multipooler)
# This allows services running on the same host to connect as any user without password.
# Security relies on network isolation - only localhost can use trust auth.
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# IPv4 external connections
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256

# IPv6 external connections
host    all             all             ::0/0                   scram-sha-256