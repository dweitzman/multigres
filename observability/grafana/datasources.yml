apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "60s"
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
          url: "http://localhost:16686/trace/$${__value.raw}"
          urlDisplayLabel: "View Trace in Jaeger"

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
