syntax = "proto3";

package consensusdata;

import "clustermetadata.proto";

option go_package = "github.com/multigres/multigres/go/pb/consensusdata";

// CoordinatorProposal is a coordinator-assisted rule proposal. It either reflects
// a rule that's not yet in WAL that the coordinator wants to write, or it could
// reflect a rule discovered in WAL that hasn't been propagated to the point of
// becoming a decision.
message CoordinatorProposal {
  // The authority under which this proposal is made. Coordinators must revoke
  // previous agents before making a proposal.
  clustermetadata.TermRevocation term_revocation = 1;

  // The node that should become primary to facilitate this proposal.
  clustermetadata.PoolerAddress proposal_leader = 2;

  // The full proposed rule. This can either be an entirely new rule or an
  // existing rule that hasn't yet finished propagating to durability.
  clustermetadata.ShardRule proposed_rule = 3;

  // When true, the leader must apply the incoming cohort GUC directly without
  // first satisfying the outgoing cohort quorum. Only valid for externally-
  // certified proposals (bootstrap, etc.).
  bool skip_outgoing_quorum = 4;
}

// RecruitRequest asks a pooler to revoke all terms below the one in the
// enclosed term_revocation and record the coordinator's exclusive right to
// propose at this term.
message RecruitRequest {
  // The revocation to accept. The pooler persists this to disk and responds
  // with its current ConsensusStatus (which includes the updated revocation).
  clustermetadata.TermRevocation term_revocation = 1;
}

// RecruitResponse carries the pooler's authoritative state after processing
// a RecruitRequest. The coordinator uses current_position to select the best
// promotion candidate.
message RecruitResponse {
  clustermetadata.ConsensusStatus consensus_status = 1;
}

// PromoteRequest carries the coordinator's complete proposal for a new shard
// state. Every cohort member receives this: the designated leader promotes
// itself; all others configure replication toward the new primary.
message PromoteRequest {
  CoordinatorProposal proposal = 1;

  // Human-readable reason for this proposal (e.g. "dead_primary", "bootstrap").
  string reason = 2;

  // IDs of cohort members that accepted the term revocation during recruitment.
  // Used to record which nodes acknowledged the proposal in the rule history.
  repeated clustermetadata.ID accepted_node_ids = 3;
}

// PromoteResponse carries the pooler's state after applying a PromoteRequest.
message PromoteResponse {
  clustermetadata.ConsensusStatus consensus_status = 1;
}

// SetPrimaryRequest tells a pooler about the current leader and the rule
// the caller knows the cluster is at. The pooler compares the supplied rule
// against its own recorded revocation (the same TermRevocation accepted via
// Recruit) using the standard not-revoked check: applied when the rule is
// not revoked (strictly exceeds outgoing_decision, or matches an accepted
// propagation_intent), otherwise it returns success without changes.
// Idempotent under retries and safe against out-of-order delivery from stale
// recovery rounds — a later, unrelated Recruit round cannot invalidate an
// already-accepted, more-advanced rule, since the not-revoked override keys
// off rule position, not revocation recency.
//
// replication_primary.primary is treated as eventually-consistent discovery
// information about where to find the primary that the (not-revoked) rule
// names. The pooler does not require primary.id to match rule.leader_id when
// the rule matches an accepted propagation_intent — a propagation flow
// legitimately points followers at a finalizing node distinct from the dead
// leader recorded in the rule.
message SetPrimaryRequest {
  // The (rule, primary, rewind_ready) the follower should adopt. Contact info
  // for the leader is replication_primary.primary (host + postgres_port used
  // to rewrite primary_conninfo); the rule is replication_primary.rule, which
  // the pooler compares against its own observed rule (by RuleNumber) and
  // only applies when strictly higher and not revoked.
  // replication_primary.rewind_ready relays whether the leader has
  // checkpointed onto its current timeline: a diverged follower defers its
  // pg_rewind until it is true, but sets up primary_conninfo and attempts to
  // stream regardless.
  clustermetadata.ReplicationPrimary replication_primary = 3;
}

// SetPrimaryResponse carries the pooler's state after processing a
// SetPrimaryRequest.
message SetPrimaryResponse {
  clustermetadata.ConsensusStatus consensus_status = 1;
}

// PropagateRequest asks the receiving pooler to finalise an in-WAL rule change
// that it already holds as a proposal. Unlike Promote, no new rule is written —
// the pooler promotes postgres, waits for the existing WAL entry to reach
// sync-standby quorum, marks it as decided, then self-promotes by writing a
// new rule at (term_revocation.revoked_below_term, 0) with the same cohort and
// durability policy.
//
// The coordinator issues Propagate to the node that holds the in-WAL proposal
// and SetPrimary to all followers, pointing them at that node as their
// replication source.
message PropagateRequest {
  // The propagation recruitment revocation. Must have propagation_intent set
  // to the rule number of the in-WAL proposal being finalised.
  clustermetadata.TermRevocation term_revocation = 1;

  // The full ShardRule the coordinator expects to find in-WAL on this node.
  // The handler validates this matches the node's current proposal exactly
  // (rule number, cohort, durability policy) before proceeding.
  clustermetadata.ShardRule expected_proposal = 2;
}

// PropagateResponse carries the pooler's state after a successful Propagate.
// On success the node has decided the propagated rule and written its
// self-promotion rule; consensus_status reflects the self-promotion decision.
message PropagateResponse {
  clustermetadata.ConsensusStatus consensus_status = 1;
}
